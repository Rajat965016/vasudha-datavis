# Render Blueprint — deploys the backend API as a Web Service.
#
# Usage: push this repository to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. The values marked `sync: false`
# are asked for in the dashboard, because they differ per environment.
#
# The PostgreSQL database can be created on Render (New → PostgreSQL) or another provider,
# then supply its connection details below. See README.
services:
  - type: web
    name: vasudha-datavis-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: SUPER_ADMIN_NAME
        value: Vasudha Super Admin
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@vasudhaindia.org
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@123
      # Tables are created on first boot.
      - key: DB_SYNC
        value: "true"
      # Cloud PostgreSQL hosts like Render require TLS.
      - key: DB_SSL
        value: "true"

      # --- PostgreSQL connection --------------------------------------------
      # Either set DATABASE_URL, or the five DB_* values below it.
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # PEM contents of the provider's CA certificate (Aiven publishes one).
      - key: DB_SSL_CA
        sync: false

      # --- Frontend origin --------------------------------------------------
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # --- Optional SMTP for the email bonus features -----------------------
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
