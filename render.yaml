# Render Blueprint — deploys the backend API as a Web Service.
#
# Usage: push this repository to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. Set MONGODB_URI and
# CORS_ORIGINS in the dashboard once the frontend URL is known.
services:
  - type: web
    name: vasudha-datavis-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"
      - key: SUPER_ADMIN_NAME
        value: Vasudha Super Admin
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@vasudhaindia.org
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@123
      # Set these in the Render dashboard — they are environment specific.
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Optional SMTP settings for the email bonus features.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
